<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="The JointJS+ SCADA Editor demo serves as a template to help bring your idea to life in no time.">
    <title>SCADA Editor | JointJS+</title>
</head>

<body>
    <div class="scada-app">
        <!-- The toolbar and the palette (.scada-stencil-panel) are created for each mode by the app. -->
        <header class="scada-toolbar-panel"></header>
        <div class="scada-main">
            <main class="scada-canvas">
                <!-- The heading of the page for screen readers (the toolbar shows the title) -->
                <h1 class="scada-visually-hidden">SCADA Editor</h1>
                <!-- On a phone: the examples to run (see `phone.ts`) -->
                <section class="scada-phone-examples" aria-label="Examples"></section>
                <div class="scada-navigator-panel"></div>
            </main>
            <aside class="scada-inspector-panel" aria-label="Inspector"></aside>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
